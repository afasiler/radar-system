version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: flight_tracker_db
    environment:
      POSTGRES_USER: flightuser
      POSTGRES_PASSWORD: flightpassword
      POSTGRES_DB: flightdb
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
